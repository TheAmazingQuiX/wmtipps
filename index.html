<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>WM 2026 Tippspiel</title>
<meta name="description" content="Tippspiel zur Fußball-Weltmeisterschaft 2026" />

<!-- Fonts: kondensierte Anzeigetafel-Display + klare Groteske + Mono fuer Zahlen -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=Archivo:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

<!-- React + ReactDOM (UMD) -->
<!-- Version bewusst fixiert (statt @18), damit zukuenftige Major-Releases
     diese Seite nicht ungewollt brechen. -->
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
<!-- Babel Standalone fuer JSX im Browser (kein Build-Schritt notwendig) -->
<!-- Version bewusst fixiert auf 7.x, da Babel 8 (ESM-only) im Browser ohne
     type="module" nicht funktioniert und zu "Cannot use import statement
     outside a module" fuehrt. -->
<script src="https://unpkg.com/@babel/standalone@7.29.7/babel.min.js"></script>
<!-- Supabase JS Client -->
<script src="https://unpkg.com/@supabase/supabase-js@2.49.4"></script>

<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div id="root"></div>

<script src="config.js"></script>
<script type="text/babel" data-presets="react" src="app.js"></script>
</body>
</html>
